server {
    # Porta acima de 1024: um utilizador sem root não pode usar portas < 1024
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não revelar a versão do Nginx nas respostas
    server_tokens off;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Comprimir CSS e JS
    gzip on;
    gzip_types text/css application/javascript;

    # Endpoint de saúde: leve, sem logs, usado por healthchecks e (mais tarde) pelo Kubernetes
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Cache de 1 hora para ficheiros estáticos
    location ~* \.(css|js)$ {
        expires 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}