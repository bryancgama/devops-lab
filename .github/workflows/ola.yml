name: Ola Mundo

on: push

jobs:
  primeiro-job:
    runs-on: ubuntu-latest
    steps:
      - name: Dizer olá
        run: echo "Olá! Estou a correr num computador do GitHub."

      - name: Mostrar onde estou
        run: |
          echo "Sistema:"
          cat /etc/os-release | head -2
          echo "Utilizador: $(whoami)"
          echo "Data: $(date)"